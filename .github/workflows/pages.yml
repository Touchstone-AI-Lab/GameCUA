# The site now lives at https://touchstone-ai-lab.github.io/bench/gamecua/, built from this branch by
# Touchstone-AI-Lab/Touchstone-AI-Lab.github.io. This repo's own Pages (/GameCUA/) only redirects there,
# keeping the rest of the path, query and hash.
name: pages
on:
  push:
    branches: [website]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>GameCUA has moved</title>
          <link rel="canonical" href="https://touchstone-ai-lab.github.io/bench/gamecua/">
          <meta http-equiv="refresh" content="0; url=https://touchstone-ai-lab.github.io/bench/gamecua/">
          <script>location.replace('https://touchstone-ai-lab.github.io/bench/gamecua/' + location.pathname.replace(/^\/GameCUA\/?/, '') + location.search + location.hash)</script>
          <p>GameCUA has moved to <a href="https://touchstone-ai-lab.github.io/bench/gamecua/">touchstone-ai-lab.github.io/bench/gamecua</a>.</p>
          HTML
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
